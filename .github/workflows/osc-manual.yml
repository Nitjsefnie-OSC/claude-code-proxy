name: claude-code-proxy fork CI

# Fork-only exact-ref validation. This file is intentionally not sent upstream.
on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Git branch, tag, or 40-character commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: claude-code-proxy-osc-manual-${{ github.repository }}-${{ inputs.target_ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Full checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout candidate ref
        uses: actions/checkout@v5
        with:
          repository: Nitjsefnie-OSC/claude-code-proxy
          ref: ${{ inputs.target_ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Report checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
            exit 1
          fi
          printf 'checked-out SHA: %s\n' "$checked_out_sha"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install tools
        run: cargo install checkle just --locked

      - name: Format check
        if: always()
        run: just format

      - name: Clippy
        if: always()
        run: just clippy

      - name: Build
        if: always()
        run: just build

      - name: Test
        if: always()
        run: just test

      - name: Clean-tree check
        if: always()
        run: |
          set -euo pipefail
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Error: checks caused uncommitted changes"
            git diff --stat
            exit 1
          fi
